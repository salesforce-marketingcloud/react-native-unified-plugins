apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.salesforce.mc.mobileappmessaging"
    compileSdk safeExtGet('compileSdkVersion', 36)
    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 26)
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets { main { java.srcDirs += 'src/main/java' } }
    buildFeatures { buildConfig true }
}

react {
    libraryName = "RNMAMSpec"
}

dependencies {
    api "com.salesforce.marketingcloud:sfmcsdk:${safeExtGet('sfmcSdkVersion', '3.1.+')}"
    api "com.salesforce.marketingcloud:mobileappmessagingsdk:${safeExtGet('mobileAppMessagingSdkVersion', '1.1.+')}"
    implementation platform("com.google.firebase:firebase-bom:${safeExtGet('firebaseBomVersion', '33.0.+')}")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.facebook.react:react-android"
}
