apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

if (project.hasProperty("newArchEnabled") && project.newArchEnabled == "true") {
    apply plugin: "com.facebook.react"
}

android {
    namespace "com.salesforce.mc.push"
    compileSdk 36
    defaultConfig { minSdk 26 }
    sourceSets { main { java.srcDirs += 'src/main/java' } }
}

dependencies {
    implementation "com.salesforce.marketingcloud:sfmcsdk:3.1.0"
    implementation "com.salesforce.marketingcloud:pushfeaturemodule:2.0.0"
    implementation "com.salesforce.marketingcloud:pushmodelsmodule:1.0.2"
    implementation platform("com.google.firebase:firebase-bom:33.0.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.facebook.react:react-android"
}
