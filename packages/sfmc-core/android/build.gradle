apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
// Apply unconditionally — RN 0.85+ is new-arch only, and the consumer app's
// `newArchEnabled` property doesn't propagate into autolinked subprojects.
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.salesforce.mc.sfmccore"
    compileSdk safeExtGet('compileSdkVersion', 36)
    defaultConfig { minSdk safeExtGet('minSdkVersion', 26) }
    sourceSets { main { java.srcDirs += 'src/main/java' } }
    buildFeatures { buildConfig true }
}

react {
    libraryName = "RNSFMCSdkCoreSpec"
}

dependencies {
    api "com.salesforce.marketingcloud:sfmcsdk:${safeExtGet('sfmcSdkVersion', '3.1.+')}"
    implementation "com.facebook.react:react-android"
}
