# JVM heap. RN 0.85 builds with Hermes pull in a lot of native deps; the default 1g
# heap OOMs partway through codegen.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# AndroidX is mandatory; legacy support libraries are not present in RN 0.85.
android.useAndroidX=true

# Hermes is the default JS engine for RN 0.85+. The example MainApplication.kt
# returns isHermesEnabled = true to match this — keep both in sync.
hermesEnabled=true

# New Architecture (Fabric + TurboModules) is mandatory for this plugin —
# Old Architecture is not supported.
newArchEnabled=true
